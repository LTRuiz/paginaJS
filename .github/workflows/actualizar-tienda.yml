name: Actualizar tienda

on:
  schedule:
    - cron: "0 * * * *"      # cada hora
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - "build.js"
      - "index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar páginas desde la planilla
        run: node build.js
      - name: Guardar cambios
        run: |
          git config user.name "tienda-bot"
          git config user.email "tienda-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Actualizar páginas de la tienda" && git push)
